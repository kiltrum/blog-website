{% extends "base.html" %}

{% block title %}
{{ article.title }} – {{ SITENAME }}
{% endblock %}

{% block content %}

<article>

    <h1>{{ article.title }}</h1>

    <p>
        {{ article.date.strftime('%d.%m.%Y') }}
        · {{ article.author }}
    </p>

    <div>
        {{ article.content }}
    </div>

</article>

{% endblock %}
