<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        {{ SITENAME }}
        {% endblock %}
    </title>

    <meta name="description" content="{{ SITENAME }} - Tourenberichte, Bikepacking und Bergabenteuer.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="container header-inner">
                <a class="site-brand" href="{{ SITEURL }}/">{{ SITENAME }}</a>
                <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Menü öffnen">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="site-nav" id="site-navigation" aria-label="Hauptnavigation">
                    <a href="{{ SITEURL }}/category/bergsteigen.html">Bergsteigen</a>
                    <a href="{{ SITEURL }}/category/bikepacking.html">Bikepacking</a>
                    <a href="{{ SITEURL }}/category/berglaufen.html">Berglaufen</a>
                    <a href="{{ SITEURL }}/#all-tours-title">Tourenkarte</a>
                    <a href="{{ SITEURL }}/pages/ueber-uns.html">Über uns</a>
                </nav>
            </div>
        </header>

        <main class="site-main">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container footer-inner">
                <p>© {{ SITENAME }}</p>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="{{ SITEURL }}/theme/js/main.js"></script>
</body>
</html>
