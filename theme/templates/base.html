<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        {{ SITENAME }}
        {% endblock %}
    </title>

    <meta name="description" content="{{ SITENAME }} - Tourenberichte, Bikepacking und Bergabenteuer.">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="container header-inner">
                <a class="site-brand" href="{{ SITEURL }}/">
                    <img src="{{ SITEURL }}/theme/images/logo.png" alt="TrailnError" class="site-brand-logo">
                </a>
                <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Menü öffnen">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <button class="search-toggle" type="button" aria-expanded="false" aria-controls="site-search" aria-label="Suche öffnen">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="10.8" cy="10.8" r="6.3"></circle>
                        <path d="m15.5 15.5 4.2 4.2"></path>
                    </svg>
                </button>
                <nav class="site-nav" id="site-navigation" aria-label="Hauptnavigation">
                    <a href="{{ SITEURL }}/category/bergsteigen.html">Bergsteigen</a>
                    <a href="{{ SITEURL }}/category/bikepacking.html">Bikepacking</a>
                    <a href="{{ SITEURL }}/category/berglaufen.html">Berglaufen</a>
                    <a href="{{ SITEURL }}/#all-tours-title">Tourenkarte</a>
                    <a href="{{ SITEURL }}/pages/ueber-uns.html">Über uns</a>
                </nav>
            </div>
            <div class="site-search" id="site-search" hidden>
                <div class="container site-search__inner">
                    <label class="site-search__label" for="site-search-input">Touren durchsuchen...</label>
                    <input id="site-search-input" class="site-search__input" type="search" placeholder="Touren durchsuchen..." autocomplete="off">
                    <div class="site-search__results" id="site-search-results" aria-live="polite"></div>
                </div>
            </div>
            {% set search_articles = all_articles if all_articles is defined else articles %}
            <script id="article-search-data" type="application/json">
                [
                {% for article in search_articles %}
                    {
                        "title": {{ article.title|tojson }},
                        "url": {{ (SITEURL ~ '/' ~ article.url)|tojson }},
                        "summary": {{ (article.summary|default('')|striptags)|tojson }},
                        "category": {{ (article.category.name if article.category else '')|tojson }},
                        "tourType": {{ (article.metadata.get('TourType') or article.metadata.get('tourtype') or '')|tojson }},
                        "location": {{ (article.metadata.get('Location') or article.metadata.get('location') or '')|tojson }}
                    }{% if not loop.last %},{% endif %}
                {% endfor %}
                ]
            </script>
        </header>

        <main class="site-main">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container footer-inner">
                <p>© {{ SITENAME }}</p>
            </div>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="{{ SITEURL }}/theme/js/main.js"></script>
</body>
</html>
