{% extends "base.html" %}

{% block content %}

<h2>Touren & Abenteuer</h2>

{% for article in articles %}

<article>

    <h2>
        <a href="{{ SITEURL }}/{{ article.url }}">
            {{ article.title }}
        </a>
    </h2>

    <p>
        {{ article.date.strftime('%d.%m.%Y') }}
        · {{ article.author }}
    </p>

</article>

{% endfor %}

{% endblock %}
